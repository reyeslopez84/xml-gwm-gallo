name: Sync Inventario Plasencia

on:
  schedule:
    - cron: '0 * * * *'  # cada hora
  workflow_dispatch:

concurrency:
  group: sync-inventario
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script
        run: python scripts/parse_feed.py

      - name: Subir XML via API de GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/upload_xml.py
