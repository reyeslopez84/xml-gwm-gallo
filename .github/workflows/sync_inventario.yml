name: Sync Inventario Plasencia

on:
  schedule:
    - cron: '0 * * * *'  # cada hora
  workflow_dispatch:       # también manual desde GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Pull últimos cambios
        run: git pull --rebase origin main

      - name: Ejecutar script
        run: python scripts/parse_feed.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.email "bot@github.com"
          git config user.name "GitHub Actions"
          git add inventario_plasencia.xml
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Update inventario $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
