name: Sync Inventario Plasencia

on:
  schedule:
    - cron: '0 * * * *'  # cada hora
  workflow_dispatch:       # también manual desde GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script
        run: python scripts/parse_feed.py

      - name: Commit si hubo cambios
        run: |
          git config user.email "bot@github.com"
          git config user.name "GitHub Actions"
          git add inventario_plasencia.xml
          git diff --cached --quiet || git commit -m "Update inventario $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
